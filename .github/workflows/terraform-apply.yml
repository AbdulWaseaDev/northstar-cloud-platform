name: Terraform Apply

on:
  push:
    branches: [main]

# Never run two applies against the same state at once.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply-dev:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: terraform init -input=false -backend-config=environments/dev/backend.hcl

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve -var-file=environments/dev/terraform.tfvars

  # Runs only after dev succeeds. Add required reviewers to the "prod"
  # environment in the repository settings to gate this job on approval.
  apply-prod:
    needs: apply-dev
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: terraform init -input=false -backend-config=environments/prod/backend.hcl

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve -var-file=environments/prod/terraform.tfvars
