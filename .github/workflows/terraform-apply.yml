name: Terraform Apply

# Manual only: applying creates billable AWS resources, so nothing deploys
# automatically on merge. Run it from the Actions tab and pick an environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev

# Never run two applies against the same state at once.
concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    # Add required reviewers to the "prod" environment in the repository
    # settings to gate prod applies on approval.
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        run: terraform init -input=false -backend-config=environments/${{ inputs.environment }}/backend.hcl

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve -var-file=environments/${{ inputs.environment }}/terraform.tfvars
